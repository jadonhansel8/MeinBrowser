name: Build MeinBrowser
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Findet den Projektordner selbst, auch wenn beim Hochladen ein
      # zusätzlicher Ordner (z. B. MeinBrowser-Tauri/) entstanden ist.
      - name: Projektordner finden und Struktur prüfen
        id: root
        shell: bash
        run: |
          echo "Dateien im Repo:"; find . -maxdepth 3 -not -path './.git/*' -not -path '*/node_modules/*' | sort
          conf=$(find . -maxdepth 3 -name tauri.conf.json -path '*/src-tauri/*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$conf" ]; then
            echo "::error::src-tauri/tauri.conf.json wurde nirgends gefunden. Die Dateien aus der ZIP müssen ins Repo (entpackt, nicht als .zip)."
            exit 1
          fi
          dir=$(dirname "$(dirname "$conf")")
          echo "Projektordner: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          cd "$dir"
          missing=0
          for f in package.json app-icon.png src/index.html src/app.js src/start.html \
                   src-tauri/Cargo.toml src-tauri/build.rs src-tauri/tauri.conf.json \
                   src-tauri/capabilities/default.json src-tauri/src/main.rs; do
            if [ ! -f "$f" ]; then echo "::error::FEHLT: $f"; missing=1; fi
          done
          if [ -f Cargo.toml ]; then
            echo "::error::Im Projektordner liegt eine Cargo.toml. Sie gehört nach src-tauri/."; missing=1
          fi
          if [ "$missing" = 1 ]; then exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.root.outputs.dir }}/src-tauri

      - name: npm install
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm install

      # Icons werden hier erzeugt, damit sie nicht im Repo liegen müssen
      - name: Icons erzeugen
        working-directory: ${{ steps.root.outputs.dir }}
        run: npx tauri icon app-icon.png

      - name: Bauen
        working-directory: ${{ steps.root.outputs.dir }}
        run: npm run build

      # Die einzelne, direkt startbare .exe
      - uses: actions/upload-artifact@v4
        with:
          name: MeinBrowser-exe
          path: ${{ steps.root.outputs.dir }}/src-tauri/target/release/meinbrowser.exe
          if-no-files-found: error

      # Der Installer (setup.exe), falls du lieber installieren willst
      - uses: actions/upload-artifact@v4
        with:
          name: MeinBrowser-Installer
          path: ${{ steps.root.outputs.dir }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
