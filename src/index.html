<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>MeinBrowser</title>
<style>
:root{--bg:#15141b;--panel:#1d1b26;--hi:#2a2837;--tx:#ece9f5;--mut:#9b97ad;--ac:#ff4f64}
body.light{--bg:#f4f3f8;--panel:#fff;--hi:#e6e4ef;--tx:#1b1a22;--mut:#6b6880}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:52px 1fr;grid-template-rows:100%;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
#side{background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
#side button,.nav button{background:none;border:0;color:var(--mut);width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer}
#side button:hover,.nav button:hover,#side button.on{background:var(--hi);color:var(--tx)}
#main{display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;background:var(--panel);padding:6px 6px 0;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;max-width:210px;min-width:90px;padding:8px 10px;border-radius:10px 10px 0 0;color:var(--mut);cursor:pointer}
.tab.on{background:var(--bg);color:var(--tx)}.tab span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab b{font-weight:400;opacity:.6}.tab b:hover{opacity:1}
.nav{display:flex;gap:4px;align-items:center;padding:6px 8px}
#url{flex:1;background:var(--hi);color:var(--tx);border:0;border-radius:18px;padding:9px 16px;font-size:14px;outline:0}
#url:focus{box-shadow:0 0 0 2px var(--ac)}
#find{display:none;padding:4px 8px}#find input{background:var(--hi);color:var(--tx);border:0;border-radius:8px;padding:6px 10px}
#body{flex:1;display:flex;min-height:0}
#views{flex:1;position:relative;min-width:0}
#panel{width:300px;background:var(--panel);padding:12px;overflow:auto;display:none}
#panel h3{margin:4px 0 10px}#panel a{display:block;padding:7px 8px;border-radius:8px;color:var(--tx);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#panel a:hover{background:var(--hi)}#panel textarea{width:100%;height:60vh;background:var(--hi);color:var(--tx);border:0;border-radius:8px;padding:8px;resize:none}
#panel button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;margin-bottom:8px}
</style></head><body>
<nav id="side">
 <button data-p="bm" title="Lesezeichen">★</button><button data-p="hist" title="Verlauf">⟲</button>
 <button data-p="notes" title="Notizen">✎</button><button data-p="set" title="Einstellungen">⚙</button>
</nav>
<div id="main">
 <div id="tabs"></div>
 <div class="nav">
  <button id="back" title="Zurück">←</button><button id="fwd" title="Vor">→</button>
  <button id="reload" title="Neu laden">↻</button>
  <input id="url" placeholder="Suchen oder Adresse eingeben" spellcheck="false">
  <button id="star" title="Lesezeichen setzen">☆</button><button id="zoomo" title="Verkleinern">−</button>
  <button id="zoomi" title="Vergrößern">+</button><button id="devt" title="Entwicklertools">{ }</button>
 </div>
 <div id="find"><input id="fq" placeholder="Auf Seite suchen"> <button id="fnext">Weiter</button></div>
 <div id="body"><div id="views"></div><aside id="panel"></aside></div>
</div>
<script src="app.js"></script></body></html>
