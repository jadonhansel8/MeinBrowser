<!doctype html><meta charset="utf-8"><title>Neuer Tab</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15141b;color:#ece9f5;font:16px system-ui,sans-serif}
main{width:min(720px,90vw);text-align:center}
h1{font-size:2.4rem;font-weight:600;margin:0 0 24px}
form{display:flex;background:#23212e;border-radius:28px;padding:6px 6px 6px 20px;margin-bottom:36px}
input{flex:1;background:none;border:0;color:inherit;font-size:1.05rem;outline:0}
button{border:0;border-radius:22px;padding:10px 22px;background:#ff4f64;color:#fff;font-weight:600;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
a{display:block;padding:22px 8px;background:#23212e;border-radius:14px;color:inherit;text-decoration:none}
a:hover,a:focus-visible{background:#2f2c3f;outline:2px solid #ff4f64}
</style>
<main><h1>Wohin geht's?</h1>
<form onsubmit="event.preventDefault();location.href='https://duckduckgo.com/?q='+encodeURIComponent(q.value)">
<input id="q" placeholder="Suchen oder Adresse eingeben" autofocus><button>Suchen</button></form>
<div class="g"><a href="https://duckduckgo.com">DuckDuckGo</a><a href="https://www.youtube.com">YouTube</a>
<a href="https://de.wikipedia.org">Wikipedia</a><a href="https://github.com">GitHub</a>
